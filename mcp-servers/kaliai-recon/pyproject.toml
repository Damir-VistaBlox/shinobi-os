[project]
name = "kaliai-recon"
version = "0.1.0"
description = "MCP server exposing scope-gated, audit-logged Kali recon tools to an AI agent"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "pyyaml>=6.0",
]

[project.scripts]
kaliai-recon = "kaliai_recon.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kaliai_recon"]

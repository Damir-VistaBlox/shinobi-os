name: Build Shinobi OS preview

on:
  workflow_dispatch:
    inputs:
      publish_metadata:
        description: Create a GitHub pre-release containing checksums and logs
        required: false
        default: false
        type: boolean
  push:
    branches:
      - preview

# Read-only by default. The one thing that needs write -- creating the
# pre-release -- is a separate job on a GitHub-hosted runner with its own
# `contents: write`, so a compromised action or a stray command in the
# multi-hour build never holds a token that can push to the repository.
#
# This started life as a step-level `permissions:` key, which is not a thing
# GitHub accepts. The file was rejected as invalid, and because the rejection
# also stopped the branch filter below from being applied, a broken workflow
# was firing a full ISO build on every push to every branch.
permissions:
  contents: read

concurrency:
  group: shinobi-preview-build
  cancel-in-progress: false

jobs:
  build:
    # This label is assigned only to the dedicated Shinobi build VM.
    # Deliberately no pull_request trigger: forks must never execute here.
    runs-on: [self-hosted, linux, x64, shinobi-builder]
    timeout-minutes: 360
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out Shinobi OS
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          check-latest: true
          package-manager-cache: false

      - name: Verify Node.js runtime
        shell: bash
        run: |
          node_version="$(node --version)"
          printf 'Using Node.js %s\n' "$node_version"
          [[ "$node_version" =~ ^v24\.[0-9]+\.[0-9]+$ ]]

      - name: Install control-plane Python dependencies
        # Two things the suite needs that a bare runner does not have.
        #
        # PyYAML is not optional: the egress gate imports it, so without this the
        # suite fails for a reason that has nothing to do with the change under
        # test. `mcp` is optional by design -- the MCP checks skip when it is
        # absent, which is right on a developer machine and wrong here, because a
        # runner that quietly skipped them would still report PASS. Installing it
        # explicitly and importing it afterwards makes the skip impossible to
        # reach by accident.
        #
        # The version bounds are copied from
        # mcp-servers/shinobi-recon/pyproject.toml, and tests/test-docs.sh
        # asserts the two agree. The upper bound is not decoration: an unbounded
        # `mcp>=1.2.0` once pulled 2.x, which renamed FastMCP and broke
        # shinobi-recon at import time on a real built image (see DESIGN.md).
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-venv
          venv="${RUNNER_TEMP}/shinobi-deps"
          python3 -m venv "$venv"
          "$venv/bin/pip" install --quiet --upgrade pip
          "$venv/bin/pip" install --quiet -r "${GITHUB_WORKSPACE}/packaging/control-plane-requirements.txt"
          echo "$venv/bin" >> "$GITHUB_PATH"
          "$venv/bin/python" -c 'import yaml, mcp, mcp.server.fastmcp; print("control-plane deps importable")'

      - name: Run source test suite
        # Source-level tests plus the package validation, which needs dpkg-deb
        # and so is skipped elsewhere. Runs before the build so a regression
        # fails in minutes instead of after a multi-hour ISO build.
        run: ./tests/run-all.sh

      - name: Build the live ISO
        env:
          SHINOBI_VARIANT: shinobi
        run: |
          sudo -E env SHINOBI_VARIANT="$SHINOBI_VARIANT" ./distro/build.sh --verbose

      - name: Generate release metadata
        id: metadata
        run: |
          iso="distro/kali-live/images/kali-linux-rolling-live-shinobi-amd64.iso"
          test -s "$iso"
          sha256sum "$iso" > shinobi-os-amd64.sha256
          du -h "$iso" > shinobi-os-amd64.size
          printf 'version=%s\n' "preview-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Validate ISO structure
        run: ./tests/test-iso-structure.sh distro/kali-live/images/kali-linux-rolling-live-shinobi-amd64.iso

      - name: Inspect installed image contents
        run: ./tests/test-image-content.sh distro/kali-live/images/kali-linux-rolling-live-shinobi-amd64.iso

      - name: Boot-test BIOS image
        run: ./tests/test-qemu-boot.sh distro/kali-live/images/kali-linux-rolling-live-shinobi-amd64.iso bios qemu-test-logs

      - name: Boot-test UEFI image
        run: ./tests/test-qemu-boot.sh distro/kali-live/images/kali-linux-rolling-live-shinobi-amd64.iso uefi qemu-test-logs

      - name: Prepare live USB preview artifact
        run: |
          iso="distro/kali-live/images/kali-linux-rolling-live-shinobi-amd64.iso"
          mkdir -p preview-iso
          # Keep each artifact file below GitHub's individual file limit while
          # retaining the exact byte stream needed to restore the ISO.
          split -b 1800M --numeric-suffixes=0 --suffix-length=3 "$iso" \
            preview-iso/shinobi-os-amd64.iso.part.
          sha256sum "$iso" > preview-iso/shinobi-os-amd64.iso.sha256
          cat > preview-iso/README.txt <<'EOF'
          Shinobi OS live USB preview

          Reassemble the ISO on Linux/macOS:

            cat shinobi-os-amd64.iso.part.* > shinobi-os-amd64.iso
            sha256sum -c shinobi-os-amd64.iso.sha256

          Write the resulting ISO to a USB device with a trusted image writer.
          The image is a hybrid BIOS/UEFI live ISO; writing it erases the USB.
          EOF

      - name: Upload live USB preview artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: shinobi-os-${{ steps.metadata.outputs.version }}-live-usb
          if-no-files-found: error
          path: preview-iso/

      - name: Upload automated test logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: shinobi-os-${{ github.run_number }}-test-logs
          if-no-files-found: warn
          path: |
            qemu-test-logs/
            distro/kali-live/images/kali-linux-rolling-live-shinobi-amd64.log

      - name: Normalize self-hosted workspace permissions
        if: always()
        run: |
          # live-build creates root-owned files inside the checkout. Restore
          # runner ownership so the next actions/checkout can cleanly reset it.
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" || true

      - name: Publish checksum and build log
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: shinobi-os-${{ steps.metadata.outputs.version }}-metadata
          path: |
            shinobi-os-amd64.sha256
            shinobi-os-amd64.size
            distro/kali-live/images/kali-linux-rolling-live-shinobi-amd64.log

  # The only job holding a write token, and the only one that ever runs off the
  # build VM. It needs two small text files, not an image, so there is no reason
  # for it to touch the machine that builds ISOs.
  publish-metadata:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_metadata == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch release metadata from the build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: shinobi-os-${{ needs.build.outputs.version }}-metadata
          path: metadata

      - name: Create GitHub pre-release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd metadata
          tag="v0.1.0-preview.$GITHUB_RUN_NUMBER"
          gh release create "$tag" \
            shinobi-os-amd64.sha256 shinobi-os-amd64.size \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Shinobi OS $tag" \
            --notes "Preview build generated by GitHub Actions. The ISO remains on the dedicated build host because it is larger than GitHub's normal release-asset limits."

# Anthropic. Cloud, same clearance requirement as any other provider that
# carries engagement data off this machine.
id = "anthropic"
name = "Anthropic"
api = "anthropic"
# The client appends /messages to this, and Anthropic serves the Messages API at
# /v1/messages: without the /v1 every request went to a path that does not exist.
base_url = "https://api.anthropic.com/v1"
egress = "cloud"
requires_key = true
default_model = "claude-sonnet-4-5"

models = [
  "claude-opus-4-1",
  "claude-sonnet-4-5",
  "claude-haiku-4-5",
]

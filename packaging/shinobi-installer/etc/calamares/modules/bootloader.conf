# Installing a bootloader on the target.
#
# GRUB on both BIOS and UEFI. Calamares' systemd-boot path would need a kernel
# naming convention of its own and a working ESP, and GRUB is what the image
# already boots from -- so the installed system starts the same way the tested
# one did.
---
efiBootLoader: "grub"
efiBootloaderId: "shinobi"

# Path conventions are Debian's and therefore Kali's: the package installs
# grub-install, and grub-mkconfig writes /boot/grub/grub.cfg.
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"

# Also write \EFI\BOOT\BOOTX64.EFI, the path firmware tries when it has no entry for
# the disk. With this off the installed system boots only while the firmware keeps the
# NVRAM entry grub-install registered, which a VM started without a persistent variable
# store, firmware that reorders or drops entries, or a disk moved to another machine
# all lose. (On a reused ESP this overwrites an existing \EFI\BOOT\BOOTX64.EFI, which is
# Calamares' own default behaviour.) An earlier version of this file also set
# efiInstallRemoveIntermediateFiles, which this version of Calamares does not read.
installEFIFallback: true

# What the wizard checks before offering to install.
---
showSupportUrl:         false
showKnownIssuesUrl:     false
showReleaseNotesUrl:    false
showDonateUrl:          false

requirements:
    # The installed system is a copy of this one, so the target needs room for
    # the whole filesystem: ~13 GB of image plus room to work.
    requiredStorage:    20
    requiredRam:        2.0

    # Stated, and never used, because "internet" is not in the check list
    # below. Calamares falls back to probing http://example.com and warns when
    # this key is missing, and an installer whose selling point is that it needs
    # no network should not ship a probe it never makes. A file: URL is the one
    # value that cannot turn into an HTTP request by accident.
    internetCheckUrl:   "file:///dev/null"

    # No "internet" check, and no geoip section at all: both would be network
    # requests from the one screen that claims to need nothing from the network.
    # Setting geoip.style to "none" is also documented as disabling it, but it
    # produces a warning every launch for being a no-op.
    check:
        - storage
        - ram
        - power
        - root
    required:
        - storage
        - ram
        - root

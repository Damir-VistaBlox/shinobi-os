# shellprocess@finish -- after the operator's account exists, before the
# bootloader is installed.
#
# One command, calling /usr/lib/shinobi/shinobi-install-finalise: apply the
# layer with the engine the ISO hook and install.sh use, remove the live
# session's settings, write provenance, configure the overlay archive, rebuild
# the initramfs, and check that the control plane actually arrived.
#
# A wizard that provisioned the desktop itself would be the fourth
# implementation of "apply the layer", and the only one with no tests. This one
# calls the same engine as the other three.
#
# The command is the script itself, not `chroot /target <script>`, and there is no
# `args:` key. Both were wrong in an earlier version of this file and both were found
# by booting the image: shellprocess has no `args:` (a script entry is a command
# string, optionally with a `timeout:`), so Calamares dropped it and ran a bare
# `chroot`, which stops at "chroot: missing operand" and failed the install; and with
# `dontChroot: false` Calamares has already entered the target's root, where there is
# no /target to chroot into anyway.
#
# The check at the end is the point of the whole step. An install that copies an
# image and reports success without confirming the control plane arrived has
# installed a desktop with no gates in it, which is indistinguishable from a
# working system until somebody tries to use it.
# `timeout:` is the limit for each command, in seconds. Calamares' default is 30, and
# this step applies the layer, writes provenance and rebuilds the initramfs
# (`update-initramfs -u -k all`), which takes longer than that on a slow disk or in a VM
# without KVM. A command that exceeds the limit is killed and the install fails.
---
dontChroot: false
timeout: 900
script:
    - command: "/usr/lib/shinobi/shinobi-install-finalise"
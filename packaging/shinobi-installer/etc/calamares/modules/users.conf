# The account the operator will use.
---
userGroup:      users
defaultGroups:
    - audio
    - video
    - plugdev
    - netdev
    - bluetooth
    - sudo
    # What a Kali account has: adm reads /var/log, dialout opens serial adapters and
    # vboxsf is the VirtualBox shared-folder group, which exists on this image. The live
    # session's account gets the same from 0032-shinobi-user-setup. wireshark and
    # kaboxer are not listed: they belong to packages this image does not install, and
    # a group made ahead of its package is not the package's group.
    - adm
    - dialout
    - vboxsf
sudoersGroup:   sudo
setRootPassword: false

# The login shell. zsh, as on the live session and on Kali: the image installs zsh,
# and kali-defaults puts .zshrc and .zprofile in /etc/skel, so the account has the
# configuration for it and a zsh login gets the same session environment as bash.
#
# It is `user: { shell: }`, not a top-level `userShell:`. Calamares 3.4.2 reads only
# the map and defaults to /bin/bash; a top-level `userShell:` was the pre-3.3 spelling
# and is ignored (upstream's own tests assert that), so the account was created with
# bash and nothing said so.
user:
    shell: /usr/bin/zsh

# No autologinGroup key, and its absence is deliberate.
#
# The key only names the group Calamares would use *if* autologin were turned
# on, so naming it is not the same as enabling it -- but it reads as though it
# were, in the one file where an operator would look to check. It is absent. The
# live session does log itself in (live-config, plus 0086-shinobi-autologin so it
# reaches Hyprland), but that entry is written at boot and is not in the image this
# wizard copies, and shellprocess@finish removes any autologin configuration that
# did come across. A pentest distribution whose installed system boots with no
# password is a serious defect rather than a convenience.

passwordRequirements:
    # No `nonempty:` key -- Calamares ignores it and says so; minLength is the
    # setting that actually applies.
    minLength: 8
    maxLength: -1
    libpwquality:
        - minlen=8

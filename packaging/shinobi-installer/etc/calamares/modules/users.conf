# The account the operator will use.
---
userGroup:      users
defaultGroups:
    - audio
    - video
    - plugdev
    - netdev
    - bluetooth
    - sudo
sudoersGroup:   sudo
setRootPassword: false

# No autologinGroup key, and its absence is deliberate.
#
# The key only names the group Calamares would use *if* autologin were turned
# on, so naming it is not the same as enabling it -- but it reads as though it
# were, in the one file where an operator would look to check. It is absent. The
# live session does log itself in (live-config, plus 0086-shinobi-autologin so it
# reaches Hyprland), but that entry is written at boot and is not in the image this
# wizard copies, and shellprocess@finish removes any autologin configuration that
# did come across. A pentest distribution whose installed system boots with no
# password is a serious defect rather than a convenience.

passwordRequirements:
    # No `nonempty:` key -- Calamares ignores it and says so; minLength is the
    # setting that actually applies.
    minLength: 8
    maxLength: -1
    libpwquality:
        - minlen=8

# Enable systemd services in the installed system.
#
# None. This module reads `units:` and ignores `services:`, which is the key an earlier
# version of this file used to ask for ssh, so ssh was never enabled and the file said
# otherwise. sshd stays off on a fresh install, as it does on Kali: a pentest workstation
# should not open a login port the operator did not ask for. To change that, list
# `- name: ssh.service` and `action: enable` here.
---
units: []

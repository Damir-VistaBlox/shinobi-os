# Unmounting the target.
#
# `emergency: true` is what makes this job run after an earlier one has failed.
# Without it Calamares logs "Skipping non-emergency job Unmounting file systems" and
# leaves the target's root, the ESP and the /dev, /proc, /sys and /run mounts under
# /tmp/calamares-root-* mounted: a failed install left /dev/vda1 mounted, and the next
# run of the wizard had to start by unmounting it by hand. It is the one key this
# module reads. (An earlier version of this file set `dontChroot: true`, which this
# module does not read: it never runs inside the target.)
---
emergency: true

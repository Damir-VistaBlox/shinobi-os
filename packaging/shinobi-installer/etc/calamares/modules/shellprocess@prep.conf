# shellprocess@prep -- between unpacking the image and creating the operator's
# account.
#
# One command. The logic it runs lives in /usr/lib/shinobi/shinobi-install-prep
# rather than here, because it is conditional -- read the live account's name out
# of the target's live-config, decide whether it is the live one or a real one,
# act on that -- and quoting that into a YAML flow sequence produced a file that
# did not parse. It is also a shipped script, so it can be read, reviewed and run
# on its own.
#
# `dontChroot: false` is the default and is what makes Calamares run the command
# inside the target's root. Stated anyway: the failure mode of getting it wrong is
# the live session being modified and reported as installed.
#
# The command is the script itself, not `chroot /target <script>`, and there is no
# `args:` key. Both were wrong in an earlier version of this file and both were found
# by booting the image: shellprocess has no `args:` (a script entry is a command
# string, optionally with a `timeout:`), so Calamares dropped it and ran a bare
# `chroot`, which stops at "chroot: missing operand" and failed the install; and with
# `dontChroot: false` Calamares has already entered the target's root, where there is
# no /target to chroot into anyway.
#
# What this step is for, in one line: the live session's account comes across
# with the image, and Calamares cannot create an account that already exists.
# `timeout:` is the limit for each command, in seconds, and Calamares kills a command
# that exceeds it and fails the install. The default is 30. This step is quick, but
# it removes an account and clears caches on a disk that may be a slow one.
---
dontChroot: false
timeout: 120
script:
    - command: "/usr/lib/shinobi/shinobi-install-prep"
# Generate /etc/fstab for the installed system.
#
# The image's own fstab points at the live medium by UUID, and it is copied along
# with everything else, so leaving it would give an installed system a root
# filesystem that does not exist until the stick is pulled out.
---
# fstab is written from the partition module's mount list, so it always matches
# what was actually done rather than what was hoped for.
baseEnabled: false
basePartition:
    mountPoint: /
    label: rootfs
    filesystem: auto
    efiSystemPartition: false
    reuseSystemPartition: false
    reuseSystemPartitionFsType: false
    efiSystemPartitionSize: 0
    size: 0
    labelIsTemporary: false
    name: "p2"
    mountOptions: []
    fsTypeOptions: []

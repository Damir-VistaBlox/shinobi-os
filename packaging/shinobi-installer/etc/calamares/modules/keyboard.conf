# The keyboard layout for the installed system, and for the rest of the wizard.
#
# The live image carries one layout, chosen when the image was built, and it does
# not know anything about the machine it is being installed onto. A UK operator on
# the live session's US layout would keep it after installing, so the wizard asks --
# and for a tool where the terminal is the interface, a wrong layout is not a
# cosmetic problem.
#
# What Calamares 3.4.2 reads from this file is the list below and nothing else: the
# module has no setting for a default layout, model or variant, and none for which
# layouts to offer. An earlier revision of this file set `keyboardLayout`,
# `keyboardModel`, `keyboardVariant` and a `layouts:` list of eleven entries "on
# purpose" to keep the page short. None of those keys exists, so none was ever
# read, and the page offers every layout in xkb's base.lst (src/modules/keyboard/
# keyboardwidget/keyboardglobal.cpp). The wizard has to work for any of them; see
# tests/test-keyboard.sh, which does not assume the eleven.
#
# What a chosen layout does, because the password typed on the Users page depends on it:
#
#   - On the installed system the keyboard job writes /etc/default/keyboard and
#     /etc/X11/xorg.conf.d/00-keyboard.conf. The login screen reads the second;
#     shinobi-keyboard (shinobi-desktop) reads the first at every login and gives
#     Hyprland, and so the lock screen, the same layout.
#
#   - On the live system Calamares runs `setxkbmap` and calls systemd-localed. Neither
#     reaches a Wayland compositor, so installer-shims/setxkbmap (shinobi-installer)
#     passes the choice to shinobi-keyboard, which makes the live session type it. That is
#     what makes the Users page password the same string the login screen later reads.
---
# The installed system's /etc/default/keyboard is how the session learns the layout.
# This is Calamares' default, but a change to it would silently put the login screen
# and the session on different layouts again, so it is written down.
writeEtcDefaultKeyboard: true

# Where the X11 side (the login screen) is written. Calamares' default, and the
# one the installed system's X server reads.
xOrgConfFileName: "/etc/X11/xorg.conf.d/00-keyboard.conf"

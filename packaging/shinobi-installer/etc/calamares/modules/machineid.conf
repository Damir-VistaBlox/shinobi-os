# A fresh machine identity for the installed system.
#
# Not optional. The image has one /etc/machine-id and installing it copies that
# file, so without this step two machines -- the USB stick and the disk it was
# installed to -- present the same identity to systemd and D-Bus, and anything
# that keys on it (journald metadata, libvirt, DHCP client identifiers by way of
# systemd-networkd) treats them as one host.
---
# Whether to leave /etc/machine-id empty in the image so that the first boot of
# the live session generates one, which is what the installed system must not
# inherit.
systemdMachineId: ""

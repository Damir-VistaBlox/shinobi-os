# /etc/default/grub for the installed system.
#
# grub2-common ships /usr/share/grub/default/grub but not /etc/default/grub: that file
# is created by the grub-pc and grub-efi-amd64 postinst scripts, which this image does
# not install (see the package list). Without this module the installed system's kernel
# command line has no `quiet splash`, so the Shinobi Plymouth theme never showed, and
# the boot menu was named for the base distribution.
---
overwrite: false
# `splash` is added by the module itself when Plymouth is present: listing it here as
# well gave the installed system `quiet splash splash`.
kernel_params: [ "quiet" ]
defaults:
    GRUB_TIMEOUT: 5
    GRUB_DEFAULT: "0"
    GRUB_DISTRIBUTOR: "Shinobi OS"

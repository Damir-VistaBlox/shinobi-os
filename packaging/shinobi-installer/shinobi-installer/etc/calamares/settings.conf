# The Shinobi Installation Wizard.
#
# Calamares configuration for installing Shinobi OS from the live image onto a
# disk. Syntax is YAML 1.2.
#
# The flow is unpackfs rather than Calamares' packages flow, and that choice is
# the whole design: this installs the system that is already running. The live
# session's package set was assembled by distro/build.sh, its desktop layer was
# installed from shinobi-desktop, and its fonts were fetched and checksum-verified
# during the image build. A packages flow would re-resolve all of that from a
# repository at the moment somebody picks a disk, which means a second list to
# keep in sync, a network dependency on an install that currently has none, and
# a font that cannot be reproduced at all because it is not in any archive.
#
# What you tested in the live session is what lands on the disk. For a security
# tool that is the property worth having.
---
# The multiarch triplet is where Kali's calamares package actually installs its
# modules. /usr/lib/calamares/modules is what upstream's own example says, and on
# Kali that directory does not exist -- which is how a wizard arrives configured
# with modules it cannot find, and reports an empty sequence instead of an error.
modules-search: [ local, /usr/lib/x86_64-linux-gnu/calamares/modules ]

oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false

# Required keys. Calamares warns and continues when these are absent, and the
# sequence still runs -- which is how a wizard ends up installing without the
# confirmation prompt, or with the target directory used directly instead of
# through a chroot.
prompt-install: true
dont-chroot: false
hide-back-and-next-during-exec: true

# Job modules that appear more than once are given instance keys, and every
# instance key has to be listed here or Calamares warns about each one on every
# launch. Both of ours run: one before the account is created, one after.
# Each entry is a map, not a bare string: a bare name gives the instance the
# default shellprocess.conf, so both jobs would share one script and the second
# would overwrite the first's work. Calamares warns about each unlisted instance
# key on every launch, which is how this was found.
instances:
  - id:       prep
    module:   shellprocess
    config:   shellprocess@prep.conf
  - id:       finish
    module:   shellprocess
    config:   shellprocess@finish.conf

# Pages, then the work, then the last page.
sequence:
    - show:
        - welcome
        - keyboard
        - partition
        - users
        - summary

    - exec:
        - partition
        - mount
        - unpackfs
        - luksbootkeyfile
        - machineid
        - fstab
        # Before users: the live session's own account comes across with the
        # image, and Calamares' users module cannot create an account that
        # already exists. Removing it here means the operator's account is the
        # only one on the installed system.
        - shellprocess@prep
        - users
        - keyboard
        # After users: the account exists, so the layer can be applied to it.
        - shellprocess@finish
        - services-systemd
        - bootloader
        - umount

    - show:
        - finished

branding: shinobi
# shellprocess@finish -- after the operator's account exists, before the
# bootloader is installed.
#
# This is where the installed system becomes a Shinobi system rather than a copy
# of a live session. It calls shinobi-setup, which is the same engine the ISO
# hook and install.sh call -- not a fourth copy of "apply the layer". If the
# wizard did its own provisioning it would be the version nobody tests.
---
dontChroot: false
script:
    # --- the layer, applied to the account that was just created ------------
    # shinobi-setup finds the account itself: the live session's has been
    # removed by shellprocess@prep and the operator's now exists, so it is the
    # only non-root account. Nothing here has to know its name.
    #
    # --force is deliberate. The image's dotfiles are authoritative for a
    # system being installed for the first time, and the home is empty anyway;
    # the alternative is a fresh install whose new account silently inherits
    # whatever the live session's skel happened to contain.
    #
    # --skip-fonts for the same reason the ISO hook does not: the font is
    # already installed in the image this copied, and reinstalling it would mean
    # a 128 MB download on a disk install that has no reason to reach the
    # network.
    - command: chroot
      args: [ /target, /usr/lib/shinobi/shinobi-setup, apply, --force, --skip-fonts ]

    # --- nothing about this session should survive onto the disk ------------
    # The one that would matter most. live-config writes an SDDM autologin entry
    # for the live session's account at first boot; the image does not contain
    # one today, so this removes nothing, and if a future image does contain one
    # this is what stops the installed system from logging itself in. A pentest
    # distribution that boots with no password is a serious defect, and the
    # failure is invisible until someone boots the disk on a train.
    - command: chroot
      args: [ /target, /bin/sh, -c, "rm -f /etc/sddm.conf.d/*autologin* /etc/sddm.conf.d/*live* 2>/dev/null; grep -rl 'Autologin' /etc/sddm.conf.d/ 2>/dev/null | xargs -r sed -i '/^Autologin=/d'; true" ]
    # And the same for GDM and LightDM, in case the base image's theme changes.
    - command: chroot
      args: [ /target, /bin/sh, -c, "rm -f /etc/gdm3/custom.conf /etc/lightdm/lightdm.conf.d/*live* 2>/dev/null; true" ]

    # The live session's own state, which is per-session by definition.
    - command: chroot
      args: [ /target, /bin/sh, -c, "rm -rf /var/lib/systemd/random-seed /run/live 2>/dev/null; true" ]

    # --- the layer's own state ------------------------------------------------
    # Provenance: which base this is, from which archive, is the first thing
    # worth answering on an engagement host, and it has to be on the disk rather
    # than in a build log.
    - command: chroot
      args: [ /target, /usr/lib/shinobi/shinobi-setup, provenance ]

    # The overlay archive, so the installed system can receive the layer's own
    # updates. The keyring ships inside shinobi-core, so nothing is fetched to
    # authenticate it -- a key retrieved over the channel it authenticates proves
    # nothing.
    #
    # Failure here is not an install failure. The release URL is per-release and
    # a developer image may have none, in which case `shinobi repo enable` exits
    # non-zero with exactly that reason on stderr. An installed system with no
    # archive configured is a working system that updates from Kali until it is
    # told where the layer lives.
    - command: chroot
      args: [ /target, /bin/sh, -c, "command -v shinobi-repo >/dev/null 2>&1 && shinobi-repo enable || true" ]

    # --- the installed system has to be able to boot -------------------------
    # The initramfs was built in a chroot whose /proc was not the target's. It
    # usually works; "usually" is not a property to ship a boot loader with.
    - command: chroot
      args: [ /target, /bin/sh, -c, "update-initramfs -u -k all >/dev/null 2>&1 || true" ]

    # --- and say so if the layer did not arrive ------------------------------
    # Silent failure is the failure mode this wizard exists to remove. If the
    # control plane is not on the disk, the machine boots to a desktop with no
    # bar and no gates, which looks like a working installation.
    - command: chroot
      args: [ /target, /bin/sh, -c, "test -x /usr/bin/shinobi-agent && test -d /usr/lib/systemd/user" ]
    - command: chroot
      args: [ /target, /bin/sh, -c, "test -x /usr/bin/shinobi-recon" ]
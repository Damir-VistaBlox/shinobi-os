# Unlock an encrypted root at boot.
#
# The boot keyfile is written into the target so the initramfs can open the
# encrypted root unattended. Its *name* is derived from the passphrase in a form
# Calamares passes to cryptsetup -- it is not a secret of ours, and it exists so
# that a wrong passphrase fails at the cryptsetup prompt rather than silently
# producing a target that cannot boot.
---
# The name Calamares gives the boot keyfile in crypttab. Kept short and explicit
# rather than descriptive: this string appears in the target's /etc/crypttab.
keyfileName: shinobi-root

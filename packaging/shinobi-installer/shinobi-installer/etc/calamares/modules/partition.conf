# How the target disk is chosen and used.
#
# Key names and value formats here are Calamares', not invented: `userSwapChoices`
# takes the words none/small/suspend/file rather than sizes, and the
# partition-table type lives in `efi:`. Both were guessed wrong first, and
# Calamares's own warnings said so -- it reported an empty swap choice list
# rather than silently installing no swap.
---
# The operator picks one of erase/alongside/manual deliberately.
#
# "none" means no choice is pre-selected, which is the right default for the one
# question in an installer where a wrong click destroys somebody's data. It is
# also what Calamares defaults to, and stated here so that changing it later is
# a deliberate act.
initialPartitioningChoice: none

defaultFileSystemType: "ext4"

# No swap by default. A 2 GiB swap file is offered as a choice rather than
# created unasked: on a modern SSD with enough RAM it costs a write and buys
# nothing, and a swap file is easy to add later without touching the partition
# table.
userSwapChoices:
    - none
    - file
initialSwapChoice: none

# Encryption, offered and real.
#
# luks2 with PBKDF2 rather than the module's luks1 default: the comment
# upstream carries on this setting is that grub does not support LUKS2 with
# Argon2id, and PBKDF2 is supported. An install encrypted with the older scheme
# because a key was left at its default is not what somebody who ticked
# "encrypt" asked for.
luksGeneration: luks2
enableLuksAutomatedPartitioning: true
preCheckEncryption: false

efi:
    mountPoint:      "/boot/efi"
    recommendedSize: 512MiB
    # The EFI spec's own floor is 32 MiB; 512 is what this image's initramfs and
    # kernel actually need with room to spare, and going below the recommendation
    # only produces a warning.
    minimumSize:     512MiB
    label:           "EFI"

# GPT for both BIOS and UEFI. Calamares would otherwise pick msdos on BIOS, and
# that is a second partition table format the installed system then carries
# forever; GRUB installs to a GPT disk from BIOS firmware without trouble.
defaultPartitionTableType: gpt

lvm:
    enable: true

# The live medium is mounted under /run/live, and this list is what stops the
# partitioning and unmount modules treating it as a target disk or unmounting it
# out from under the running session. Without "live-*" in here, an installer
# offered the USB stick it was booted from as somewhere to install to.
essentialMounts: [ "live-*", "control", "ventoy" ]

# Manual partitioning stays available. "Erase" means what it says, and some
# people have more than one disk.
allowManualPartitioning: true

# The wizard says which disk it will erase before it does, so this is about the
# label being visible rather than about confirmation.
alwaysShowPartitionLabels: true

drawNestedPartitions: false
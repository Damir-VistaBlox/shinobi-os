# The last page.
# Reboot into what was just installed rather than back into the live session,
# which is the one that makes the result checkable: an operator who reboots into
# the live image again cannot tell a successful install from a lucky one.
#
# Calamares 3.4 calls these settings deprecated and warns about them. They are
# what 3.4 still reads, and the replacement key was not something to guess at:
# an unrecognised key would leave the wizard with no way to reboot at all, which
# is a worse outcome than a warning on a pre-release image.
restartNowEnabled: true
restartNowChecked: true
restartNowCommand: "systemctl -i reboot"

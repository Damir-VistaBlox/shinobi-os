# Installing a bootloader on the target.
#
# GRUB on both BIOS and UEFI. Calamares' systemd-boot path would need a kernel
# naming convention of its own and a working ESP, and GRUB is what the image
# already boots from -- so the installed system starts the same way the tested
# one did.
---
efiBootLoader: "grub"
efiBootloaderId: "shinobi"

# Path conventions are Debian's and therefore Kali's: the package installs
# grub-install, and grub-mkconfig writes /boot/grub/grub.cfg.
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
installEFIFallback: false

# Left to the umount module's timing rather than Calamares' own fallback copy,
# which writes into an ESP it may not have mounted at that point.
efiInstallRemoveIntermediateFiles: true

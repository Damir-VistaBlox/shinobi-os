# The console and keyboard layout for the installed system.
#
# The live image carries one layout, chosen when the image was built, and it
# does not know anything about the machine it is being installed onto. A UK
# operator on the live session's US layout would keep it after installing, so the
# wizard asks -- and for a tool where the terminal is the interface, a wrong
# layout is not a cosmetic problem.
---
keyboardLayout:            "us"
keyboardModel:             "pc105"
keyboardVariant:           ""
keyboardAdditionalLayout:  ""
keyboardAdditionalVariant: ""

# The layouts offered, in the order they are listed. A short list on purpose:
# this is a question with an obvious answer for most people, and a list of 200
# makes people pick the first entry instead of thinking.
layouts:
    - [ "us",  "" ]
    - [ "gb",  "" ]
    - [ "de",  "" ]
    - [ "fr",  "azerty" ]
    - [ "es",  "" ]
    - [ "it",  "" ]
    - [ "pt",  "" ]
    - [ "nl",  "" ]
    - [ "se",  "" ]
    - [ "ru",  "" ]
    - [ "ua",  "" ]

# shellprocess@prep -- between unpacking the image and creating the operator's
# account.
#
# Two jobs, both of which exist because something copied from the live image is
# wrong on an installed system.
#
# Every command here runs in the target's chroot. `chroot` is how Calamares
# reaches it, so the command is `chroot <target> <command> <args>`; a command
# written to assume it is already inside the target would edit the live session
# instead, which is the mistake this file is careful not to make.
#
# `dontChroot: false` is the default and is what makes chroot apply. It is
# stated anyway below, because the failure mode of getting it wrong is the
# live session being modified and reported as installed.
---
dontChroot: false
script:
    # --- the live session's own account -------------------------------------
    # The image was booted from, so it contains an account created by
    # live-config for the live session. Calamares' users module cannot create an
    # account that already exists, so leaving it there means the wizard either
    # fails or creates a second one. It is removed, and only if its home is
    # absent -- which is the signature of the copied live account. An account
    # with a home directory is a real one and is left alone.
    - command: chroot
      args: [ /target, /bin/sh, -c, "id shinobi >/dev/null 2>&1 && [ ! -d /home/shinobi ] && userdel -r shinobi 2>/dev/null; true" ]
    # Anything else whose home was excluded for the same reason: an account with
    # no home directory is an artefact of the copy, not a user.
    - command: chroot
      args: [ /target, /bin/sh, -c, "for u in $(awk -F: '$3>=1000 && $3<65534 {print $1}' /etc/passwd); do [ ! -d \"/home/$u\" ] && userdel -r \"$u\" 2>/dev/null; done; true" ]

    # --- the live medium, and what it leaves behind -------------------------
    # A live system has an fstab pointing at the medium and a mount entry for it.
    # fstab is regenerated by the fstab module, but the medium's entry in
    # /etc/fstab.bak-style leftovers and in mtools.conf is not.
    - command: chroot
      args: [ /target, /bin/sh, -c, "rm -f /etc/mtab /etc/fstab.d/live 2>/dev/null; true" ]

    # The live session's kernel command line is not the installed system's.
    - command: chroot
      args: [ /target, /bin/sh, -c, "rm -f /etc/kernel-img.conf 2>/dev/null; true" ]

    # Apt lists came from the image build and are stale for the installed
    # system. Removing them means an `apt update` later is a real update rather
    # than a no-op against a cache that claims everything is current.
    - command: chroot
      args: [ /target, /bin/sh, -c, "rm -rf /var/lib/apt/lists/* 2>/dev/null; true" ]

    # --- verification --------------------------------------------------------
    # If the target is not a chroot-able system at this point, everything after
    # this is about to fail in a way that says nothing about why. Failing here,
    # with the reason, is the difference between "the install failed" and
    # "there is no /bin/sh in the target, so nothing that follows could run".
    - command: chroot
      args: [ /target, /bin/sh, -c, "test -x /bin/sh" ]
    - command: chroot
      args: [ /target, /bin/sh, -c, "test -d /usr/share/shinobi-dotfiles" ]
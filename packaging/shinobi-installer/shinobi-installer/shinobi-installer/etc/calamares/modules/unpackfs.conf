# What gets copied onto the target.
---
unpack:
    # The live filesystem, as the medium presents it. Tried first because it is
    # the only source that is guaranteed to be the image the operator booted.
    -   source: "/run/live/medium/live/filesystem.squashfs"
        sourcefs: "squashfs"
        destination: ""
        exclude:
            # Nobody inherits the live session's home directory. It belongs to an
            # account that exists only because the image boots as it, its files
            # are the ones the operator has been clicking through, and shipping
            # them means an installed machine starts with a populated home it
            # cannot explain. The new account's home is built from /etc/skel
            # instead, which is where the layer's dotfiles live.
            - "/home/*"
            - "/root/*"
            # The live session's passwordless sudo grant, if the image writes one
            # at build time. On the installed system it would authorise an
            # account that no longer exists, and if the operator later creates
            # one with that name it would authorise them with no password.
            - "/etc/sudoers.d/live"
            # Scratch state that is meaningless off the medium.
            - "/var/lib/dhcp/*"
            - "/var/lib/NetworkManager/*"
            - "/var/cache/man/*"

    # The mounted medium, as a fallback if the squashfs is somewhere else. The
    # first source to succeed wins, so a working /run/live/medium/live path
    # makes this one never run.
    -   source: "/run/live/medium"
        sourcefs: "directory"
        destination: ""
        optional: true
        exclude:
            - "/home/*"
            - "/root/*"
            - "/etc/sudoers.d/live"

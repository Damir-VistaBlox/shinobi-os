# Start SDDM after Plymouth has quit.
#
# Debian's sddm.service is ordered after getty@tty1 but not after Plymouth (its own comment
# says "If using tty1 and plymouth, sddm will fail till plymouth stops", and its changelog
# says the ordering is left to the user). So on a boot with a splash the two start at the
# same time. plymouthd still has /dev/tty1 open when SDDM looks for a free console, so SDDM
# takes tty2 and tells Xorg to switch to it, and that switch is lost while plymouthd is
# tearing down tty1: the screen stays on tty1 -- a white screen -- until somebody presses
# Ctrl-Alt-F2. Upstream SDDM's own unit has this ordering.
#
# Only After=, deliberately. Not Requires=, so a splash that fails does not stop the login
# screen; not plymouth-quit-wait.service, which has no timeout and would let a stuck
# plymouthd block it forever; and plymouth must not be told to retain its splash, which
# would leave the console in graphics mode and make the keypress useless too.
[Unit]
After=plymouth-quit.service

# The Shinobi OS login screen.
#
# This is SDDM's vendor layer, not /etc: SDDM merges /usr/lib/sddm/sddm.conf.d first,
# then /etc/sddm.conf.d, then /etc/sddm.conf, each overriding the one before. So the
# package ships its defaults here, where an upgrade replaces them, and an operator who
# wants something different (the on-screen keyboard back on a touch screen, another
# theme) writes it in /etc/sddm.conf.d, where nothing of ours will ever overwrite it.

[General]
# No on-screen keyboard. SDDM's built-in default is the Qt virtual keyboard, which the
# image has installed, and it pops up over the lower half of the screen when the password
# field takes focus -- on a desktop PC, covering the field it is meant to help with.
InputMethod=

[Theme]
Current=shinobi

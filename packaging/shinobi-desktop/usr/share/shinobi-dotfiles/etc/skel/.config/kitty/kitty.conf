# shinobi-theme set <name> repoints colors.conf. Existing kitty windows don't
# hot-reload it (would need `kitty @ set-colors` with remote control on) —
# new terminals pick it up.
include colors.conf

font_family JetBrainsMono Nerd Font Mono
font_size 11.0
confirm_os_window_close 0
background_opacity 0.94
window_padding_width 12
cursor_shape beam
enable_audio_bell no

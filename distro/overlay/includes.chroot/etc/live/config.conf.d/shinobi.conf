# The live session's account is created here rather than renamed afterwards.
#
# Kali's live image ships a `kali` account, and for a while Shinobi's image
# renamed it with usermod in a build hook, then rewrote the sudoers rules that
# name it. Both steps were guarded, because both are fragile, and both were
# papering over the simpler thing: live-config reads the account name from
# these variables, so the account can simply be created as Shinobi's.
#
# The name matters more than it looks. `kali@kali` on the login screen was the
# last visible piece of Kali on an otherwise Shinobi system, and a pentest
# distro's login prompt is not the place to advertise its base distribution.
#
# This file sorts after kali.conf, which is what gives it precedence: live-config
# reads config.conf.d/*.conf in order and the last value for a key wins.
LIVE_USERNAME="shinobi"
LIVE_HOSTNAME="shinobi"
LIVE_USER_FULLNAME="Shinobi Operator"

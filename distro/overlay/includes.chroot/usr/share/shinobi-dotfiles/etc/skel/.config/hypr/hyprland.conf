# Shinobi OS default Hyprland config.
#
# This is a lean, self-contained config, not a port of Omarchy's actual
# dotfiles — Omarchy's config calls its own helper binaries (omarchy-menu,
# omarchy-shell, uwsm-app, ...) that don't exist on Kali. What's kept from
# Omarchy is the spirit: sane defaults, a status bar, a launcher, and the
# same SUPER+SHIFT+CTRL+A binding Omarchy uses for its agent — pointed here
# at `shinobi agent` instead.

# shinobi-theme set <name> repoints this symlink; source it before any use of
# $active_border/$inactive_border/$bg below so a theme switch only needs
# `hyprctl reload`, not editing this file.
source = ~/.config/hypr/colors.conf

monitor = , preferred, auto, auto

# Establish the Wayland environment before D-Bus can activate portals or the
# Quickshell service. The bootstrapper has a short bounded retry for SDDM's
# user-bus startup race, then systemd owns restarts for the full session.
exec-once = shinobi-session
exec-once = hypridle
exec-once = mako
# Keep clipboard history useful across all Wayland applications. cliphist is
# already installed by the image package list; these watchers feed it text and
# images without changing what applications see on the clipboard.
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# hyprpolkitagent: Hyprland-native, no competing-session dependency (unlike
# lxqt-policykit, which hard-depends on lxqt-session and registered a second
# SDDM session — caught by an actual build; see kali.list.chroot).
exec-once = /usr/libexec/hyprpolkitagent
# Baked into the live ISO, so the desktop has a distinct Shinobi identity
# before a user selects a theme.
exec-once = swaybg -i /usr/share/backgrounds/shinobi-os/shinobi-night.png -m fill
exec-once = shinobi-welcome

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

input {
  kb_layout = us
  follow_mouse = 1
  touchpad {
    natural_scroll = true
  }
}

general {
  # Small, deliberate gaps — close to Omarchy's compact 5/10 default.
  gaps_in = 5
  gaps_out = 10
  border_size = 2
  col.active_border = $active_border
  col.inactive_border = $inactive_border
  layout = dwindle
}

decoration {
  # Keep the compositor inexpensive and the visual language utilitarian.
  rounding = 0
  shadow {
    enabled = false
  }
  blur {
    enabled = false
  }
}

animations {
  enabled = true
  # Fast visual confirmation only. Workspaces and bars change immediately.
  bezier = easeOutQuint, 0.23, 1, 0.32, 1
  bezier = almostLinear, 0.5, 0.5, 0.75, 1
  bezier = quick, 0.15, 0, 0.1, 1
  animation = border, 1, 5, easeOutQuint
  animation = windows, 1, 4, easeOutQuint, popin 87%
  animation = fade, 1, 3, quick
  animation = workspaces, 0
}

$terminal = kitty
$launcher = wofi --show drun
$agent = kitty --title shinobi-agent -e shinobi-agent

bind = SUPER, Return, exec, $terminal
bind = SUPER, D, exec, $launcher
bind = SUPER, SPACE, exec, shinobi-menu
bind = SUPER SHIFT CTRL, A, exec, $agent
bind = SUPER, Q, killactive
bind = SUPER, L, exec, hyprlock
bind = SUPER, ESCAPE, exec, shinobi-power menu
bind = SUPER SHIFT, E, exit
bind = SUPER, F, togglefloating
bind = SUPER, V, layoutmsg, togglesplit
bind = , Print, exec, shinobi-capture full
bind = SUPER, Print, exec, shinobi-capture region

bind = SUPER, B, exec, shinobi-bluetooth menu
bind = SUPER, N, exec, shinobi-network menu
bind = SUPER SHIFT, V, exec, cliphist list | wofi --dmenu --prompt clipboard | cliphist decode | wl-copy
bind = SUPER, F1, exec, shinobi-menu keybindings
bind = SUPER SHIFT, R, exec, hyprctl reload

# Window management extras. Fullscreen/center/pin are plain built-in
# dispatchers; gaps/opacity need remembered state, so those go through
# shinobi-hypr-toggle instead.
bind = SUPER SHIFT, F, fullscreen
bind = SUPER, C, centerwindow
bind = SUPER SHIFT, P, pin
bind = SUPER, G, exec, shinobi-hypr-toggle gaps
bind = SUPER, O, exec, shinobi-hypr-toggle opacity

# Media keys. bindl (not bind) so they still work on the lock screen.
bindl = , XF86AudioRaiseVolume, exec, shinobi-audio up
bindl = , XF86AudioLowerVolume, exec, shinobi-audio down
bindl = , XF86AudioMute, exec, shinobi-audio mute-toggle
bindl = , XF86AudioMicMute, exec, shinobi-audio mic-mute-toggle

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

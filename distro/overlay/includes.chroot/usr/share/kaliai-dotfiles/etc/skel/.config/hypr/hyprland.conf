# KaliAI default Hyprland config.
#
# This is a lean, self-contained config, not a port of Omarchy's actual
# dotfiles — Omarchy's config calls its own helper binaries (omarchy-menu,
# omarchy-shell, uwsm-app, ...) that don't exist on Kali. What's kept from
# Omarchy is the spirit: sane defaults, a status bar, a launcher, and the
# same SUPER+SHIFT+CTRL+A binding Omarchy uses for its agent — pointed here
# at `kaliai agent` instead.

# kaliai-theme set <name> repoints this symlink; source it before any use of
# $active_border/$inactive_border/$bg below so a theme switch only needs
# `hyprctl reload`, not editing this file.
source = ~/.config/hypr/colors.conf

monitor = , preferred, auto, auto

exec-once = waybar
exec-once = hypridle
exec-once = mako
# lxqt-policykit-agent installs to a fixed /usr/bin path (unlike
# polkit-kde-agent-1, whose binary lives under an arch-specific libexec dir).
exec-once = lxqt-policykit-agent
exec-once = swaybg -c $bg

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

input {
  kb_layout = us
  follow_mouse = 1
  touchpad {
    natural_scroll = true
  }
}

general {
  gaps_in = 4
  gaps_out = 8
  border_size = 2
  col.active_border = $active_border
  col.inactive_border = $inactive_border
  layout = dwindle
}

decoration {
  rounding = 6
  blur {
    enabled = true
    size = 4
    passes = 2
  }
}

animations {
  enabled = true
}

dwindle {
  pseudotile = true
  preserve_split = true
}

$terminal = kitty
$launcher = wofi --show drun
$agent = kitty --title kaliai-agent -e kaliai-agent

bind = SUPER, Return, exec, $terminal
bind = SUPER, D, exec, $launcher
bind = SUPER, SPACE, exec, kaliai-menu
bind = SUPER SHIFT CTRL, A, exec, $agent
bind = SUPER, Q, killactive
bind = SUPER, L, exec, hyprlock
bind = SUPER, ESCAPE, exec, kaliai-power menu
bind = SUPER SHIFT, E, exit
bind = SUPER, F, togglefloating
bind = SUPER, V, togglesplit
bind = , Print, exec, kaliai-capture full
bind = SUPER, Print, exec, kaliai-capture region

bind = SUPER, B, exec, kaliai-bluetooth menu
bind = SUPER, N, exec, kaliai-network menu

# Window management extras. Fullscreen/center/pin are plain built-in
# dispatchers; gaps/opacity need remembered state, so those go through
# kaliai-hypr-toggle instead.
bind = SUPER SHIFT, F, fullscreen
bind = SUPER, C, centerwindow
bind = SUPER SHIFT, P, pin
bind = SUPER, G, exec, kaliai-hypr-toggle gaps
bind = SUPER, O, exec, kaliai-hypr-toggle opacity

# Media keys. bindl (not bind) so they still work on the lock screen.
bindl = , XF86AudioRaiseVolume, exec, kaliai-audio up
bindl = , XF86AudioLowerVolume, exec, kaliai-audio down
bindl = , XF86AudioMute, exec, kaliai-audio mute-toggle
bindl = , XF86AudioMicMute, exec, kaliai-audio mic-mute-toggle

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

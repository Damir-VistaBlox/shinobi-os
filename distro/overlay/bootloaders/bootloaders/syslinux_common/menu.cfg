menu hshift 0
menu width 82

menu title SHINOBI OS live menu (BIOS mode)
include stdmenu.cfg
include live.cfg
include shinobi-installer.cfg
# There is no @OPTIONAL_INSTALLER_INCLUDE@ here, deliberately. It pulls in Kali's own
# installer entries ("Start installer", "Start installer with speech synthesis" and
# "Advanced install options"), which install plain Kali with none of Shinobi's layer and
# sat unlabelled beside ours. Shinobi's wizard is the installer on this menu.
menu begin utilities
        menu label ^Utilities
        menu title Shinobi OS utilities
        include stdmenu.cfg
        label mainmenu
                menu label ^Back..
                menu exit
        include utilities.cfg
menu end

menu clear

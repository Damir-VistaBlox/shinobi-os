menu hshift 0
menu width 82

menu title SHINOBI OS live menu (BIOS mode)
include stdmenu.cfg
include live.cfg
include shinobi-installer.cfg
# Kali's own installer, which live-build generates (install.cfg) and which installs Kali
# without any of Shinobi's layer. It is kept as a fallback for a machine the wizard cannot
# handle, behind a label that says what it is, as the UEFI menu does (grub-pc/grub.cfg),
# rather than as four bare "Start installer" lines beside Shinobi's. With no installer in
# the image live-build removes the placeholder, and the submenu is just a way back.
menu begin kali-installer
        menu label ^Kali installer (installs Kali, not Shinobi OS)
        menu title Kali installer: installs Kali, not Shinobi OS
        include stdmenu.cfg
        label mainmenu
                menu label ^Back..
                menu exit
        @OPTIONAL_INSTALLER_INCLUDE@
menu end
menu begin utilities
        menu label ^Utilities
        menu title Shinobi OS utilities
        include stdmenu.cfg
        label mainmenu
                menu label ^Back..
                menu exit
        include utilities.cfg
menu end

menu clear

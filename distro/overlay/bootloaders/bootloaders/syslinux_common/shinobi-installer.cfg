# Shinobi OS installation, for BIOS boot.
#
# Kept in its own file, included from our menu.cfg, for the same reason the GRUB
# entries live in ours rather than in Kali's: this is an overlay of Kali's boot
# configuration, and editing Kali's file in the submodule would be a fork.
#
# The account is named on the command line for the same reason as in the GRUB
# menu: live-config creates the live session's account from the kernel command
# line, which takes precedence over /etc/live/config.conf.d. Our parameters come
# after Kali's and live-config keeps the last value it sees.
#
# shinobi.installer=1 is read by the live session at login, which starts the Shinobi
# Installation Wizard. It is inert on every other entry.
#
# No `menu default` here, deliberately. Kali's live entry keeps it, so the menu
# opens on a system that changes nothing: somebody who plugs this medium in to
# run a tool should not land in an installer, and the entry is two keys away.
label live-shinobi-install
        menu label ^Install Shinobi OS
        linux @LINUX@
        initrd @INITRD@
        append @APPEND_LIVE@ username=shinobi hostname=shinobi shinobi.installer=1

label live-shinobi-install-text
        menu label Install Shinobi OS (^text mode)
        linux @LINUX@
        initrd @INITRD@
        append @APPEND_LIVE@ username=shinobi hostname=shinobi shinobi.installer=1 text

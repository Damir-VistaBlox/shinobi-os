# Live Image (UEFI boot)
#
# This is Kali's own grub.cfg, kept here as an overlay copy with three changes,
# each marked below. Modifying the submodule's file directly would fork Kali's
# boot configuration; live-build copies whatever is under bootloaders/ in this
# overlay into the build tree, so the copy is ours to change and Kali's stays
# theirs.
#
# live-build substitutes the @...@ placeholders exactly as it does for Kali's
# copy, so this is still a template and not a copy of a built menu.
source /boot/grub/config.cfg

# Shinobi OS installation.
#
# The same live session as the entry below, with two differences. The account is
# named here because live-config creates it from the kernel command line and
# that takes precedence over the image's own configuration files -- so naming it
# in /etc/live/config.conf.d alone would be silently overridden by Kali's
# `username=kali` in @APPEND_LIVE@. Our tokens come after it, and live-config
# takes the last value it sees, so ours wins without depending on how the
# substitution is ordered internally.
#
# And shinobi.installer=1 is read by the live session at login: the desktop
# starts the Shinobi Installation Wizard instead of waiting to be clicked. It is
# an inert kernel parameter on every other entry.
menuentry "Install Shinobi OS" {
        linux @KERNEL_LIVE@ @APPEND_LIVE@ username=shinobi hostname=shinobi shinobi.installer=1
        initrd @INITRD_LIVE@
}

# The same, for a machine whose display manager is not cooperating. Not the
# default because a wizard that opens at a login prompt is a wizard nobody
# finishes; but a live session whose desktop does not come up has no wizard at
# all, and the way to reach it is a terminal.
menuentry "Install Shinobi OS (text mode)" {
        linux @KERNEL_LIVE@ @APPEND_LIVE@ username=shinobi hostname=shinobi shinobi.installer=1 text
        initrd @INITRD_LIVE@
}

# Live boot
@LINUX_LIVE@

menuentry "Live system (@FLAVOUR_LIVE@ forensic mode)" {
        linux @KERNEL_LIVE@ @APPEND_LIVE@ noswap noautomount
        initrd @INITRD_LIVE@
}
# Kali's persistence entry, relabelled. The feature is live-boot's and it works
# here; the parenthetical pointed an operator at kali.org from a boot menu whose
# whole job is not to send them back to the base distribution. Where the feature
# is documented is a maintainer note, not something on the screen.
menuentry "Live system with USB persistence" {
        linux @KERNEL_LIVE@ @APPEND_LIVE@ persistence
        initrd @INITRD_LIVE@
}
menuentry "Live system with USB Encrypted persistence" {
        linux @KERNEL_LIVE@ @APPEND_LIVE@ persistent=cryptsetup persistence-encryption=luks persistence
        initrd @INITRD_LIVE@
}

# Installer (if any)
if @ENABLE_INSTALL_MENU@; then

source  /boot/grub/install_start.cfg

if [ ! -e /boot/grub/install.cfg ]; then
menuentry "Kali installer with speech synthesis" {
        linux @KERNEL_GI@ speakup.synth=soft @APPEND_GI@
        initrd @INITRD_GI@
}
fi

# Kali's own installer, kept as a fallback and relabelled. It installs Kali
# without any of Shinobi's layer -- no control plane, no scope gate, no desktop
# configuration -- which makes it the right tool for repairing a machine and the
# wrong one for installing this product. Calling it "Kali installer" is the
# honest label; calling it "Start installer" beside our own entry is how an
# operator ends up with the wrong system and no idea why.
submenu 'Advanced install options...' --hotkey=a {

        source /boot/grub/theme.cfg

        source	/boot/grub/install.cfg

}
fi

submenu 'Utilities...' --hotkey=u {

        source /boot/grub/theme.cfg

        # Memtest (if any)
        if @ENABLE_MEMTEST@; then
                source /boot/grub/memtest.cfg
        fi

        # Firmware setup (UEFI)
        if [ "${grub_platform}" = "efi" ]; then
                menuentry "UEFI Firmware Settings" --hotkey=f {
                        fwsetup
                }
        fi

}
